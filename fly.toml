# Fly.io config — https://fly.io/docs/reference/configuration/
#
#   fly launch --no-deploy --copy-config
#   fly volumes create pricescout_data --size 1
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32) SERPAPI_KEY=...
#   fly deploy
#
# Change `app` to your own name before deploying.
app = "pricescout"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATABASE_FILE = "/data/pricescout.db"
  SERVE_STATIC = "true"
  TRUST_PROXY = "true"
  PRICE_PROVIDERS = "serpapi"
  PRICE_REFRESH_CRON = "0 7 * * *"
  PRICE_REFRESH_BATCH = "25"
  MIN_REFRESH_MINUTES = "720"

[http_service]
  internal_port = 4000
  force_https = true
  # The price-refresh job runs inside this process, so the machine must stay
  # up. Letting Fly stop it would silently stop your price checks.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Frame-Options = "SAMEORIGIN"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

# SQLite needs a real disk. One machine only — a second machine would get its
# own copy of the database.
[[mounts]]
  source = "pricescout_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
