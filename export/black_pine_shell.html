<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#06070a">
	<meta name="description" content="A first-person psychological survival horror game set in the Black Pine Basin. Runs entirely in the browser.">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		/* The loader is styled to match the game's palette so the transition from
		   page to game is not a jump cut. `dvh` keeps the canvas honest on mobile
		   browsers whose address bar changes the viewport height mid-session. */
		:root {
			--ink: #06070a;
			--bone: #d5d3cb;
			--bone-dim: #6f736a;
			--moss: #5c7353;
		}

		html, body {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100dvh;
			overflow: hidden;
			background: var(--ink);
			color: var(--bone);
			font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
			/* Stop iOS Safari treating a drag on the canvas as a page gesture. */
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: none;
		}

		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 1.1rem;
			background: radial-gradient(ellipse at 50% 42%, #0d1013 0%, #06070a 72%);
			z-index: 10;
			transition: opacity 0.6s ease;
		}

		#status.done { opacity: 0; pointer-events: none; }

		#status-splash { display: none; }

		#brand {
			font-size: clamp(1.7rem, 6vw, 3rem);
			letter-spacing: 0.34em;
			margin-right: -0.34em;
			font-weight: 400;
			color: var(--bone);
		}

		#tagline {
			font-size: clamp(0.72rem, 2.4vw, 0.95rem);
			color: var(--bone-dim);
			font-style: italic;
			text-align: center;
			max-width: 26rem;
			padding: 0 1.5rem;
			line-height: 1.55;
		}

		#status-progress {
			appearance: none;
			-webkit-appearance: none;
			width: min(62vw, 22rem);
			height: 3px;
			border: 0;
			background: #16191c;
		}
		#status-progress::-webkit-progress-bar { background: #16191c; }
		#status-progress::-webkit-progress-value { background: var(--moss); }
		#status-progress::-moz-progress-bar { background: var(--moss); }

		#hint {
			font-size: 0.72rem;
			letter-spacing: 0.16em;
			color: #4a4e47;
			text-transform: uppercase;
			text-align: center;
			padding: 0 1.5rem;
		}

		#detail {
			font-size: 0.78rem;
			letter-spacing: 0.1em;
			color: var(--moss);
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			text-align: center;
			padding: 0 1.5rem;
			min-height: 1.1em;
		}

		#reload {
			display: none;
			appearance: none;
			-webkit-appearance: none;
			background: #16191c;
			border: 1px solid #3a4038;
			border-radius: 6px;
			color: var(--bone);
			font: inherit;
			font-size: 0.95rem;
			padding: 0.85rem 2.4rem;
			cursor: pointer;
		}

		#build {
			position: fixed;
			bottom: 0.6rem;
			left: 0;
			right: 0;
			text-align: center;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.62rem;
			letter-spacing: 0.08em;
			color: #33372f;
		}

		#status-notice {
			background: #1a1113;
			border: 1px solid #5b3239;
			border-radius: 6px;
			color: #ded9d2;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.82rem;
			line-height: 1.5;
			margin: 0 1.5rem;
			padding: 1rem 1.2rem;
			max-width: 34rem;
			text-align: left;
			white-space: pre-wrap;
			display: none;
		}

		/* Landscape is strongly preferred on a phone: the touch controls put a
		   thumb in each bottom corner and portrait squeezes them into the play
		   area. This is a nudge, not a lock — the game is playable either way,
		   so the nudge must never sit between the player and the canvas.
		   `pointer-events: none` is load-bearing: an earlier version of this
		   overlay was a full-screen opaque cover, which on a portrait phone
		   swallowed the tap that starts the game. */
		#rotate {
			position: fixed;
			left: 50%;
			transform: translateX(-50%);
			bottom: max(1rem, env(safe-area-inset-bottom));
			display: none;
			align-items: center;
			gap: 0.6rem;
			background: rgba(6, 7, 10, 0.82);
			border: 1px solid #23272b;
			border-radius: 999px;
			color: var(--bone-dim);
			font-size: 0.78rem;
			letter-spacing: 0.06em;
			z-index: 20;
			text-align: center;
			padding: 0.55rem 1.1rem;
			max-width: calc(100vw - 2rem);
			pointer-events: none;
			transition: opacity 0.5s ease;
		}
		#rotate span { font-size: 1.1rem; line-height: 1; }
		#rotate.faded { opacity: 0; }

		@media (orientation: portrait) and (max-width: 820px) {
			body.playing #rotate { display: flex; }
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas element.</canvas>

	<noscript>This game requires JavaScript.</noscript>

	<div id="status">
		<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
		<div id="brand">THE BLACK PINE</div>
		<div id="tagline">the basin remembers every sound it has ever heard</div>
		<progress id="status-progress"></progress>
		<!-- The loader and the game's own title card are deliberately similar, which
		     made a bug report impossible to place: "stuck on the loading screen" fits
		     both. This line only exists on the loader, and it always says what is
		     happening right now. -->
		<div id="detail">preparing</div>
		<div id="hint">headphones recommended &middot; first load may take a moment</div>
		<div id="status-notice"></div>
		<button id="reload" type="button">Reload</button>
		<div id="build"></div>
	</div>

	<div id="rotate">
		<span>&#8635;</span>
		<div>Best played sideways</div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Stamped by tools/stamp-build.sh after export. If it still reads as the raw
// placeholder, this file was exported without going through that script.
const BUILD_ID = '__BUILD_ID__';

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusDetail = document.getElementById('detail');
	const reloadButton = document.getElementById('reload');
	const hint = document.getElementById('hint');
	document.getElementById('build').textContent = 'build ' + BUILD_ID;

	// Everything worth knowing when this goes wrong on a device that is not
	// here. There is no console on a phone, so the page has to be able to say
	// what happened by itself.
	const boot = {
		phase: 'fetching the engine',
		downloaded: 0,
		expected: 0,
		lastChange: Date.now(),
		// Waiting for a human is not a stall. The title card sits here for as
		// long as it takes someone to notice their phone.
		waiting: false,
		finished: false,
		errors: [],
	};

	// A stall is defined by nothing changing, not by elapsed time: a 38 MB
	// download over a bad connection is slow but healthy, and accusing it of
	// being stuck would be wrong more often than right.
	const STALL_SECONDS = 45;

	function mb(bytes) { return (bytes / 1048576).toFixed(1); }

	function setPhase(phase) {
		boot.phase = phase;
		boot.lastChange = Date.now();
		statusDetail.textContent = phase;
	}

	function note(err) {
		let text = 'unknown';
		if (err instanceof Error) {
			text = err.message + (err.stack ? ' | ' + String(err.stack).split('\n')[1] : '');
		} else if (err !== null && err !== undefined) {
			text = String(err);
		}
		if (boot.errors.indexOf(text) === -1) {
			boot.errors.push(text);
		}
		console.error(err);
	}

	// Captured rather than displayed: a single error during startup is not
	// necessarily fatal, and blanking the screen over a recoverable one would
	// turn a playable session into a broken-looking one. They are shown only
	// alongside a failure or a stall, where they are the useful part.
	window.addEventListener('error', function (event) {
		note(event.error || event.message);
	});
	window.addEventListener('unhandledrejection', function (event) {
		note(event.reason);
	});

	function diagnostics() {
		const lines = [
			'build       ' + BUILD_ID,
			'phase       ' + boot.phase,
			'downloaded  ' + mb(boot.downloaded)
				+ (boot.expected > 0 ? ' / ' + mb(boot.expected) : '') + ' MB',
			'threads     ' + GODOT_THREADS_ENABLED,
			'screen      ' + window.innerWidth + 'x' + window.innerHeight
				+ ' @' + (window.devicePixelRatio || 1),
		];
		if (navigator.deviceMemory) {
			lines.push('memory      ' + navigator.deviceMemory + ' GB');
		}
		lines.push('agent       ' + navigator.userAgent);
		if (boot.errors.length > 0) {
			lines.push('', 'errors:');
			boot.errors.slice(0, 4).forEach(function (e) { lines.push('  ' + e); });
		}
		return lines.join('\n');
	}

	function showNotice(headline) {
		statusNotice.textContent = headline + '\n\n' + diagnostics();
		statusNotice.style.display = 'block';
		statusProgress.style.display = 'none';
		statusDetail.style.display = 'none';
		hint.style.display = 'none';
		reloadButton.style.display = 'block';
		// The overlay may already have faded out over a running game. A notice
		// that renders into a hidden node is the same as no notice at all, which
		// is the failure mode this whole path exists to prevent.
		statusOverlay.style.display = 'flex';
		statusOverlay.classList.remove('done');
	}

	function displayFailureNotice(err) {
		note(err);
		boot.finished = true;
		showNotice('The game could not start.');
	}

	reloadButton.addEventListener('click', function () {
		// `reload(true)` is long gone, so bust the cache by hand: a half-written
		// or stale 38 MB payload is exactly the kind of thing a plain reload
		// hands straight back.
		const url = new URL(window.location.href);
		url.searchParams.set('reload', String(Date.now()));
		window.location.replace(url.toString());
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice(
			'This browser is missing features the game needs:\n\n' + missing.join('\n')
			+ '\n\nWebGL2 is required. On iOS, use Safari 15 or newer.'
		);
		return;
	}

	setPhase('downloading');
	engine.startGame({
		'onProgress': function (current, total) {
			boot.downloaded = current;
			boot.expected = total;
			boot.lastChange = Date.now();
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				statusDetail.textContent = 'downloading  ' + mb(current) + ' / ' + mb(total) + ' MB';
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
				statusDetail.textContent = 'downloading  ' + mb(current) + ' MB';
			}
		},
	}).then(function () {
		document.body.classList.add('playing');
		setPhase('starting the engine');
		statusOverlay.classList.add('done');
		// Hidden rather than removed once the fade finishes, so the game's own
		// title card is what the player sees underneath — but the node survives
		// in case something later needs to put a notice back on screen.
		setTimeout(function () {
			if (!boot.finished) {
				statusOverlay.style.display = 'none';
			}
		}, 700);
	}, displayFailureNotice);

	// The game reports its own boot stages back out to the page, so a hang after
	// the engine starts names the stage it hung on rather than showing a black
	// rectangle.
	window.blackPineStage = function (stage) {
		const name = String(stage);
		setPhase(name);
		boot.waiting = name === 'title card';
		if (name === 'menu') {
			boot.finished = true;
		}
	};

	// Android Chrome honours this once the page has a user gesture; iOS Safari
	// rejects it, which is why the banner exists as well. Either way a refusal
	// must not throw into the game's tap handler.
	window.blackPineRequestLandscape = function () {
		const rotate = document.getElementById('rotate');
		if (rotate) {
			rotate.classList.add('faded');
		}
		try {
			if (screen.orientation && screen.orientation.lock) {
				const locked = screen.orientation.lock('landscape');
				if (locked && locked.catch) {
					locked.catch(function () {});
				}
			}
		} catch (e) { /* unsupported, and that is fine */ }
	};

	// Runs from page load, not from engine start. The previous version armed
	// only once the engine was already running, which meant the one failure that
	// leaves nothing on screen — the engine never starting at all — was the one
	// failure it could not report.
	setInterval(function () {
		if (boot.finished || boot.waiting) {
			boot.lastChange = Date.now();
			return;
		}
		if ((Date.now() - boot.lastChange) / 1000 >= STALL_SECONDS) {
			boot.finished = true;
			showNotice('The game stopped while starting up, at "' + boot.phase + '".');
		}
	}, 4000);

	// Keep the canvas the size of the visual viewport. Mobile browsers change
	// this when the address bar collapses, and Godot's own resize policy does
	// not see `dvh` changes on iOS.
	function fitCanvas() {
		const canvas = document.getElementById('canvas');
		if (!canvas) {
			return;
		}
		const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
		const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
		canvas.style.width = width + 'px';
		canvas.style.height = height + 'px';
	}
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 250); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}
	fitCanvas();
}());
	</script>
</body>
</html>
