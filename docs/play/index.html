<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#06070a">
	<meta name="description" content="A first-person psychological survival horror game set in the Black Pine Basin. Runs entirely in the browser.">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>The Black Pine</title>
	<style>
		/* The loader is styled to match the game's palette so the transition from
		   page to game is not a jump cut. `dvh` keeps the canvas honest on mobile
		   browsers whose address bar changes the viewport height mid-session. */
		:root {
			--ink: #06070a;
			--bone: #d5d3cb;
			--bone-dim: #6f736a;
			--moss: #5c7353;
		}

		html, body {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100dvh;
			overflow: hidden;
			background: var(--ink);
			color: var(--bone);
			font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
			/* Stop iOS Safari treating a drag on the canvas as a page gesture. */
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: none;
		}

		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 1.1rem;
			background: radial-gradient(ellipse at 50% 42%, #0d1013 0%, #06070a 72%);
			z-index: 10;
			transition: opacity 0.6s ease;
		}

		#status.done { opacity: 0; pointer-events: none; }

		#status-splash { display: none; }

		#brand {
			font-size: clamp(1.7rem, 6vw, 3rem);
			letter-spacing: 0.34em;
			margin-right: -0.34em;
			font-weight: 400;
			color: var(--bone);
		}

		#tagline {
			font-size: clamp(0.72rem, 2.4vw, 0.95rem);
			color: var(--bone-dim);
			font-style: italic;
			text-align: center;
			max-width: 26rem;
			padding: 0 1.5rem;
			line-height: 1.55;
		}

		#status-progress {
			appearance: none;
			-webkit-appearance: none;
			width: min(62vw, 22rem);
			height: 3px;
			border: 0;
			background: #16191c;
		}
		#status-progress::-webkit-progress-bar { background: #16191c; }
		#status-progress::-webkit-progress-value { background: var(--moss); }
		#status-progress::-moz-progress-bar { background: var(--moss); }

		#hint {
			font-size: 0.72rem;
			letter-spacing: 0.16em;
			color: #4a4e47;
			text-transform: uppercase;
			text-align: center;
			padding: 0 1.5rem;
		}

		#status-notice {
			background: #1a1113;
			border: 1px solid #5b3239;
			border-radius: 6px;
			color: #ded9d2;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.82rem;
			line-height: 1.5;
			margin: 0 1.5rem;
			padding: 1rem 1.2rem;
			max-width: 34rem;
			text-align: left;
			white-space: pre-wrap;
			display: none;
		}

		/* Landscape is strongly preferred on a phone: the touch controls put a
		   thumb in each bottom corner and portrait squeezes them into the play
		   area. This is a nudge, not a lock — the game is playable either way,
		   so the nudge must never sit between the player and the canvas.
		   `pointer-events: none` is load-bearing: an earlier version of this
		   overlay was a full-screen opaque cover, which on a portrait phone
		   swallowed the tap that starts the game. */
		#rotate {
			position: fixed;
			left: 50%;
			transform: translateX(-50%);
			bottom: max(1rem, env(safe-area-inset-bottom));
			display: none;
			align-items: center;
			gap: 0.6rem;
			background: rgba(6, 7, 10, 0.82);
			border: 1px solid #23272b;
			border-radius: 999px;
			color: var(--bone-dim);
			font-size: 0.78rem;
			letter-spacing: 0.06em;
			z-index: 20;
			text-align: center;
			padding: 0.55rem 1.1rem;
			max-width: calc(100vw - 2rem);
			pointer-events: none;
			transition: opacity 0.5s ease;
		}
		#rotate span { font-size: 1.1rem; line-height: 1; }
		#rotate.faded { opacity: 0; }

		@media (orientation: portrait) and (max-width: 820px) {
			body.playing #rotate { display: flex; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas element.</canvas>

	<noscript>This game requires JavaScript.</noscript>

	<div id="status">
		<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
		<div id="brand">THE BLACK PINE</div>
		<div id="tagline">the basin remembers every sound it has ever heard</div>
		<progress id="status-progress"></progress>
		<div id="hint">headphones recommended &middot; first load may take a moment</div>
		<div id="status-notice"></div>
	</div>

	<div id="rotate">
		<span>&#8635;</span>
		<div>Best played sideways</div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":437936,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const hint = document.getElementById('hint');

	let initializing = true;

	function showNotice(text) {
		statusNotice.textContent = text;
		statusNotice.style.display = 'block';
		statusProgress.style.display = 'none';
		hint.style.display = 'none';
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = 'An unknown error occurred.';
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === 'string') {
			message = err;
		}
		showNotice(message);
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice(
			'This browser is missing features the game needs:\n\n' + missing.join('\n')
			+ '\n\nWebGL2 is required. On iOS, use Safari 15 or newer.'
		);
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
	}).then(function () {
		document.body.classList.add('playing');
		statusOverlay.classList.add('done');
		// Let the fade finish before removing the node, so the game's own title
		// card is what the player sees underneath rather than a flash of canvas.
		setTimeout(function () { statusOverlay.remove(); }, 700);
		initializing = false;
		armBootWatchdog();
	}, displayFailureNotice);

	// The game reports its boot stages back out to the page. On a phone there is
	// no console to read, so if the title card never hands over to the menu the
	// watchdog puts the last stage on screen instead of leaving a black rectangle
	// with no explanation.
	let lastStage = 'waiting for the first tap';
	let handedOver = false;
	let watchdog = 0;

	window.blackPineStage = function (stage) {
		lastStage = String(stage);
		if (lastStage === 'menu') {
			handedOver = true;
			clearTimeout(watchdog);
		}
		// Nudging the deadline means a slow-but-progressing phone is never
		// accused of being stuck.
		if (!handedOver && watchdog) {
			armBootWatchdog();
		}
	};

	// Android Chrome honours this once the page has a user gesture; iOS Safari
	// rejects it, which is why the banner exists as well. Either way a refusal
	// must not throw into the game's tap handler.
	window.blackPineRequestLandscape = function () {
		const rotate = document.getElementById('rotate');
		if (rotate) {
			rotate.classList.add('faded');
		}
		try {
			if (screen.orientation && screen.orientation.lock) {
				const locked = screen.orientation.lock('landscape');
				if (locked && locked.catch) {
					locked.catch(function () {});
				}
			}
		} catch (e) { /* unsupported, and that is fine */ }
	};

	function armBootWatchdog() {
		clearTimeout(watchdog);
		watchdog = setTimeout(function () {
			if (handedOver) {
				return;
			}
			const notice = document.createElement('div');
			notice.id = 'status-notice';
			notice.style.cssText = 'position:fixed;left:1rem;right:1rem;bottom:1rem;'
				+ 'z-index:30;display:block';
			notice.textContent = 'The game stopped responding while starting up.\n\n'
				+ 'Last stage: ' + lastStage + '\n\n'
				+ 'Reload the page to try again. If it stops here every time, the '
				+ 'device may not have enough memory for this build.';
			document.body.appendChild(notice);
		}, 60000);
	}

	// Keep the canvas the size of the visual viewport. Mobile browsers change
	// this when the address bar collapses, and Godot's own resize policy does
	// not see `dvh` changes on iOS.
	function fitCanvas() {
		const canvas = document.getElementById('canvas');
		if (!canvas) {
			return;
		}
		const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
		const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
		canvas.style.width = width + 'px';
		canvas.style.height = height + 'px';
	}
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 250); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}
	fitCanvas();
}());
	</script>
</body>
</html>
