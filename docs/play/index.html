<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#06070a">
	<meta name="description" content="A first-person psychological survival horror game set in the Black Pine Basin. Runs entirely in the browser.">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>The Black Pine</title>
	<style>
		/* The loader is styled to match the game's palette so the transition from
		   page to game is not a jump cut. `dvh` keeps the canvas honest on mobile
		   browsers whose address bar changes the viewport height mid-session. */
		:root {
			--ink: #06070a;
			--bone: #d5d3cb;
			--bone-dim: #6f736a;
			--moss: #5c7353;
		}

		html, body {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100dvh;
			overflow: hidden;
			background: var(--ink);
			color: var(--bone);
			font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
			/* Stop iOS Safari treating a drag on the canvas as a page gesture. */
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: none;
		}

		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 1.1rem;
			background: radial-gradient(ellipse at 50% 42%, #0d1013 0%, #06070a 72%);
			z-index: 10;
			transition: opacity 0.6s ease;
		}

		#status.done { opacity: 0; pointer-events: none; }

		#status-splash { display: none; }

		#brand {
			font-size: clamp(1.7rem, 6vw, 3rem);
			letter-spacing: 0.34em;
			margin-right: -0.34em;
			font-weight: 400;
			color: var(--bone);
		}

		#tagline {
			font-size: clamp(0.72rem, 2.4vw, 0.95rem);
			color: var(--bone-dim);
			font-style: italic;
			text-align: center;
			max-width: 26rem;
			padding: 0 1.5rem;
			line-height: 1.55;
		}

		#status-progress {
			appearance: none;
			-webkit-appearance: none;
			width: min(62vw, 22rem);
			height: 3px;
			border: 0;
			background: #16191c;
		}
		#status-progress::-webkit-progress-bar { background: #16191c; }
		#status-progress::-webkit-progress-value { background: var(--moss); }
		#status-progress::-moz-progress-bar { background: var(--moss); }

		#hint {
			font-size: 0.72rem;
			letter-spacing: 0.16em;
			color: #4a4e47;
			text-transform: uppercase;
			text-align: center;
			padding: 0 1.5rem;
		}

		#status-notice {
			background: #1a1113;
			border: 1px solid #5b3239;
			border-radius: 6px;
			color: #ded9d2;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.82rem;
			line-height: 1.5;
			margin: 0 1.5rem;
			padding: 1rem 1.2rem;
			max-width: 34rem;
			text-align: left;
			white-space: pre-wrap;
			display: none;
		}

		/* Landscape is strongly preferred on a phone: the touch controls put a
		   thumb in each bottom corner and portrait squeezes them into the play
		   area. This is a nudge, not a lock — the game is playable either way. */
		#rotate {
			position: fixed;
			inset: 0;
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 0.9rem;
			background: var(--ink);
			color: var(--bone-dim);
			z-index: 20;
			text-align: center;
			padding: 2rem;
		}
		#rotate span { font-size: 2.4rem; }

		@media (orientation: portrait) and (max-width: 820px) {
			body.playing #rotate { display: flex; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas element.</canvas>

	<noscript>This game requires JavaScript.</noscript>

	<div id="status">
		<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
		<div id="brand">THE BLACK PINE</div>
		<div id="tagline">the basin remembers every sound it has ever heard</div>
		<progress id="status-progress"></progress>
		<div id="hint">headphones recommended &middot; first load may take a moment</div>
		<div id="status-notice"></div>
	</div>

	<div id="rotate">
		<span>&#8635;</span>
		<div>Turn your device sideways.</div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":430772,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const hint = document.getElementById('hint');

	let initializing = true;

	function showNotice(text) {
		statusNotice.textContent = text;
		statusNotice.style.display = 'block';
		statusProgress.style.display = 'none';
		hint.style.display = 'none';
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = 'An unknown error occurred.';
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === 'string') {
			message = err;
		}
		showNotice(message);
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice(
			'This browser is missing features the game needs:\n\n' + missing.join('\n')
			+ '\n\nWebGL2 is required. On iOS, use Safari 15 or newer.'
		);
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
	}).then(function () {
		document.body.classList.add('playing');
		statusOverlay.classList.add('done');
		// Let the fade finish before removing the node, so the game's own title
		// card is what the player sees underneath rather than a flash of canvas.
		setTimeout(function () { statusOverlay.remove(); }, 700);
		initializing = false;
	}, displayFailureNotice);

	// Keep the canvas the size of the visual viewport. Mobile browsers change
	// this when the address bar collapses, and Godot's own resize policy does
	// not see `dvh` changes on iOS.
	function fitCanvas() {
		const canvas = document.getElementById('canvas');
		if (!canvas) {
			return;
		}
		const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
		const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
		canvas.style.width = width + 'px';
		canvas.style.height = height + 'px';
	}
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 250); });
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}
	fitCanvas();
}());
	</script>
</body>
</html>
