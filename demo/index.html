   *
   * @param {{ artKind?: string, artPalette?: string, title?: string, category?: string, brand?: string }} product

  function resolveArt(product = {}) {
    const haystack = `${product.brand ?? ''} ${product.title ?? ''} ${product.category ?? ''}`;

    if (product.artKind && SHAPES[product.artKind]) {
      return { kind: product.artKind, palette: product.artPalette ?? 'slate' };
    }

    for (const [pattern, [kind, palette]] of KEYWORD_SHAPES) {

  /**

   * badge in the comparison table and its line on the chart always match.
   */
  const KNOWN_RETAILERS = ['Amazon', 'Walmart', 'Target', 'Best Buy', 'eBay', 'B&H Photo', 'Newegg', 'Costco'];

  function retailerSlot(name) {
    const normalized = String(name ?? '').toLowerCase().replace(/\.(com|co\.uk|ca)$/, '').trim();
    const index = KNOWN_RETAILERS.findIndex((known) => known.toLowerCase() === normalized);
    if (index >= 0) return index + 1;
    return (seedFrom(normalized) % 8) + 1;
  }

  const retailerColor = (name) => 'var(--s' + retailerSlot(name) + ')';

  function retailerInitials(name) {
    const words = String(name ?? '?').replace(/&/g, ' ').split(/\s+/).filter(Boolean);
    if (words.length > 1) return words.slice(0, 2).map((word) => word[0]).join('').toUpperCase();
    const word = words[0] ?? '?';
    return (word[0] + (word[1] ?? '')).replace(/^./, (c) => c.toUpperCase());
  }

  /** cyrb53 — a fast, deterministic string hash (stands in for the server's sha1). */
  function hashStr(str) {
    let h1 = 0xdeadbeef;
    let h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i += 1) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0) ^ (h1 >>> 0);

  function seededRandom(seed) {
    let a = seed >>> 0;
    return function next() {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  const noiseAt = (seed, index) => seededRandom((seed ^ (index * 2654435761)) >>> 0)() - 0.5;

  /** Deterministic price for one retailer on one calendar day. */
  function priceCents(slug, retailer, day, base) {
    const profile = RETAILERS[retailer] || { bias: 0 };
    const rs = seedFrom(slug + ':' + retailer);

    const trend = Math.sin((day + (rs % 120)) / 58) * 0.045;
    const drift = Math.cos((day + (rs % 300)) / 190) * 0.03;

    const week = Math.floor(day / 7);
    const position = (day - week * 7) / 7;
    const wobble =
      (noiseAt(rs, week) * (1 - position) + noiseAt(rs, week + 1) * position) * 0.04 +
      noiseAt(rs ^ 0x9e37, day) * 0.003;

    const roll = seededRandom((rs ^ (week * 40503)) >>> 0)();
    const depth = roll > 0.86 ? 0.05 + (roll - 0.86) * 0.9 : 0;
    const promo = -depth * (0.65 + 0.35 * Math.sin(Math.PI * position));

    const factor = 1 + profile.bias + trend + drift + wobble + promo;
    const raw = Math.max(Math.round(base * 0.55), Math.round(base * factor));
    return Math.round(raw / 100) * 100 - 1;

  function shippingCents(retailer, price, slug, day) {

    if (profile.freeShipOver === 0 || price >= profile.freeShipOver) return 0;
    return seededRandom((seedFrom(slug + ':' + retailer + ':ship') ^ day) >>> 0)() > 0.7 ? 0 : profile.ship;
  }

  function deliveryEstimate(retailer, day) {
    const profile = RETAILERS[retailer] || { days: 4 };

  function offersFor(entry, day) {

    return list.map((retailer) => {
      const price = priceCents(entry.slug, retailer, day, entry.base);
      const ship = shippingCents(retailer, price, entry.slug, day);
      const stockRoll = seededRandom((seedFrom(entry.slug + ':' + retailer + ':stock') ^ Math.floor(day / 3)) >>> 0)();

        retailer,
        priceCents: price,
        shippingCents: ship,
        totalCents: price + ship,
        inStock: stockRoll > 0.08,
        condition: retailer === 'eBay' && stockRoll < 0.35 ? 'refurbished' : 'new',
        delivery: deliveryEstimate(retailer, day),

    });

  /** Daily series: blended best plus each retailer's own best, oldest first. */

      const day = today - back;
      const offers = offersFor(entry, day).filter((offer) => offer.inStock);
      if (!offers.length) continue;
      const byRetailer = {};
      let best = Infinity;
      for (const offer of offers) {
        byRetailer[offer.retailer] = offer.totalCents;
        if (offer.totalCents < best) best = offer.totalCents;
      }
      series.push({ day, date: new Date(day * DAY_MS), best, byRetailer });
    }
    return series;
  }

    const full = historyFor(entry, 365, today);
    const bests = window.map((point) => point.best);
    const current = bests.length ? bests[bests.length - 1] : null;
    const allTimeLow = full.length ? Math.min.apply(null, full.map((p) => p.best)) : null;
    const avg = bests.length ? Math.round(bests.reduce((a, b) => a + b, 0) / bests.length) : null;

    const priorWindow = full.filter((point) => point.day >= today - 10 && point.day <= today - 3);
    const prior = priorWindow.length ? Math.min.apply(null, priorWindow.map((p) => p.best)) : null;
    const dropPct = current != null && prior ? Math.round(((prior - current) / prior) * 1000) / 10 : null;

    return {
      days,
      current,
      min: bests.length ? Math.min.apply(null, bests) : null,
      max: bests.length ? Math.max.apply(null, bests) : null,
      avg,
      allTimeLow,
      isAllTimeLow: current != null && allTimeLow != null && current <= allTimeLow,
      isBelowAverage: current != null && avg != null && current < avg,
      percentBelowAverage: current != null && avg ? Math.round(((avg - current) / avg) * 1000) / 10 : null,
      recentDropPercent: dropPct != null && dropPct > 0 ? dropPct : null,
      hasRecentDrop: dropPct != null && dropPct >= 3,
      dataPoints: bests.length,
    };
  }

  // --- matching ------------------------------------------------------

  const NOISE = new Set(['the', 'and', 'with', 'for', 'new', 'model', 'inch', 'in', 'of', 'a', 'an', 'wireless', 'bluetooth', 'edition', 'gen', 'generation']);
  const tokenize = (value) => String(value || '').toLowerCase().split(/[^a-z0-9]+/).filter((t) => t.length > 1);

  function synthesize(query) {
    const title = String(query).replace(/[^a-z0-9 ]/gi, ' ').replace(/\s+/g, ' ').trim()
      .replace(/\b[a-z]/g, (c) => c.toUpperCase()) || 'Unknown Product';
    const seed = seedFrom('synthetic:' + title.toLowerCase());
    const rand = seededRandom(seed);
    return {
      slug: 'synthetic-' + seed.toString(16),
      title,
      brand: title.split(' ')[0],
      model: null,
      upc: null,
      category: 'General',
      base: Math.round((1500 + rand() * 60000) / 100) * 100 - 1,
      retailers: DEFAULT_RETAILERS,
      synthesized: true,
    };
  }

  function classify(input) {
    const value = String(input || '').trim();
    if (!value) return 'empty';
    if (/^https?:\/\//i.test(value)) return 'url';
    if (/^\d{8,14}$/.test(value)) return 'barcode';
    return 'text';
  }

  function search(rawQuery) {
    const kind = classify(rawQuery);
    if (kind === 'empty') return { kind, entries: [] };

    let query = String(rawQuery).trim();

    if (kind === 'barcode') {
      const exact = CATALOG.find((entry) => entry.upc === query);
      return { kind, entries: [exact || CATALOG[seedFrom(query) % CATALOG.length]] };
    }

    if (kind === 'url') {
      let parsed;
      try { parsed = new URL(query); } catch (error) { return { kind, entries: [] }; }
      query = parsed.pathname.split('/')
        .filter((part) => part && !/^(dp|gp|product|ip|p|itm|site)$/i.test(part) && !/^[A-Z0-9]{8,}$/.test(part))
        .join(' ').replace(/[-_+]/g, ' ').trim() || parsed.hostname;
    }

    const tokens = tokenize(query).filter((token) => !NOISE.has(token));
    const scored = CATALOG.map((entry) => {
      const hay = tokenize([entry.title, entry.brand, entry.model, entry.category].join(' '));
      let score = 0;
      for (const token of tokens) {
        if (hay.includes(token)) score += 2;
        else if (hay.some((h) => h.startsWith(token) || token.startsWith(h))) score += 1;
      }
      return { entry, score };
    }).filter((item) => item.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);

    return { kind, entries: scored.length ? scored.map((item) => item.entry) : [synthesize(query)] };
  }

  const bySlug = (slug) => CATALOG.find((entry) => entry.slug === slug) || null;

  // =====================================================================
  // Local state — this demo has no backend, so the watchlist, alerts and
  // recents live in this browser only.
  // =====================================================================

  const KEY = 'pricescout.demo.v1';

  const defaults = {
    watches: {},          // slug -> { targetCents, createdAt, lastAlertCents }
    notifications: [],    // { id, slug, type, title, body, priceCents, retailer, url, at, read }
    recentSearches: [],
    recentlyViewed: [],   // slugs
    dayOffset: 0,         // demo control: jump the calendar forward
    customEntries: {},    // synthesized products the user searched for
  };

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? Object.assign({}, defaults, JSON.parse(raw)) : Object.assign({}, defaults);
    } catch (error) {
      return Object.assign({}, defaults);
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) { /* private mode */ }
  }

  const today = () => Math.floor(Date.now() / DAY_MS) + state.dayOffset;

  function entryFor(slug) {
    return bySlug(slug) || state.customEntries[slug] || null;
  }

  function rememberEntry(entry) {
    if (!bySlug(entry.slug)) {
      state.customEntries[entry.slug] = entry;
    }
  }

  // --- alerts --------------------------------------------------------

  const REALERT_DAYS = 7;

  /** Evaluates every watch and appends notifications. Returns how many fired. */
  function evaluateWatches() {
    const day = today();
    let created = 0;

    for (const slug of Object.keys(state.watches)) {
      const watch = state.watches[slug];
      const entry = entryFor(slug);
      if (!entry) continue;

      const offers = offersFor(entry, day).filter((offer) => offer.inStock)
        .sort((a, b) => a.totalCents - b.totalCents);
      const best = offers[0];
      if (!best) continue;

      const stats = statsFor(entry, 90, day);
      let alert = null;

      if (watch.targetCents != null && best.totalCents <= watch.targetCents) {
        alert = { type: 'target_hit', title: 'Target price reached', reason: 'Now at or below your ' + money(watch.targetCents) + ' target.' };
      } else if (stats.isAllTimeLow) {
        alert = { type: 'all_time_low', title: 'Lowest price we have seen', reason: 'This is the lowest total price in the tracked history.' };
      } else if (stats.avg != null && stats.dataPoints >= 5 && best.totalCents <= Math.round(stats.avg * 0.98)) {
        alert = { type: 'below_average', title: 'Below its usual price', reason: stats.percentBelowAverage + '% below the 90-day average of ' + money(stats.avg) + '.' };
      }

      if (!alert) continue;

      // Suppress repeats unless the price improves or a week has passed.
      const improved = watch.lastAlertCents == null || best.totalCents < watch.lastAlertCents;
      const stale = watch.lastAlertDay == null || day - watch.lastAlertDay >= REALERT_DAYS;
      if (!improved && !stale) continue;

      state.notifications.unshift({
        id: 'n' + Date.now() + Math.random().toString(16).slice(2, 6),
        slug,
        type: alert.type,
        title: alert.title,
        body: entry.title + ' — ' + money(best.totalCents) + ' at ' + best.retailer + '. ' + alert.reason,
        priceCents: best.totalCents,
        retailer: best.retailer,
        url: best.url,
        at: Date.now(),
        read: false,
      });
      watch.lastAlertCents = best.totalCents;
      watch.lastAlertDay = day;
      created += 1;
    }

    state.notifications = state.notifications.slice(0, 50);
    if (created) save();
    return created;
  }

  const unreadCount = () => state.notifications.filter((n) => !n.read).length;

  // =====================================================================
  // Formatting
  // =====================================================================

  const currency = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const money = (cents) => (cents == null || Number.isNaN(cents) ? '—' : currency.format(cents / 100));

  function moneyShort(cents) {
    const dollars = cents / 100;
    if (dollars >= 1000) return '$' + (dollars / 1000).toFixed(dollars >= 10000 ? 0 : 1) + 'k';
    return '$' + Math.round(dollars);
  }

  const shortDate = (date) => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const longDate = (date) => date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });

  function relativeTime(ms) {
    const minutes = Math.round((Date.now() - ms) / 60000);
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + 'm ago';
    const hours = Math.round(minutes / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.round(hours / 24) + 'd ago';
  }

  /**
   * Product imagery: the real photograph when a listing has one, otherwise a
   * drawing of that kind of product. Sample data has no photographs, so the
   * drawings are what you see here — but a search result still reads as
   * *headphones* rather than as two initials.
   */
  function productImage(entry, size, options) {
    const opts = options || {};
    const tile = el('div', {
      class: 'thumb' + (opts.hero ? ' thumb-hero' : '') + (opts.class ? ' ' + opts.class : ''),
      style: size ? 'width:' + size + ';height:' + size : '',
    });
    if (entry && entry.imageUrl) {
      tile.appendChild(el('img', { src: entry.imageUrl, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }));
    } else {
      tile.innerHTML = productArtSvg(entry || {});
    }
    return tile;
  }

  /** Retailer mark — the colour matches that retailer's line on the chart. */
  function retailerMark(retailer, size) {
    return el('span', {
      class: 'retailer-mark',
      style: 'background:' + retailerColor(retailer) + (size ? ';width:' + size + ';height:' + size : ''),
      'aria-hidden': 'true',
      text: retailerInitials(retailer),
    });
  }

  function parseMoney(input) {
    const match = String(input || '').replace(/[, ]/g, '').match(/\d+(\.\d+)?/);
    return match ? Math.round(parseFloat(match[0]) * 100) : null;
  }

  // =====================================================================
  // DOM helpers
  // =====================================================================

  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      for (const key of Object.keys(props)) {
        const value = props[key];
        if (value == null || value === false) continue;
        if (key === 'class') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key === 'html') node.innerHTML = value;
        else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
        else node.setAttribute(key, value === true ? '' : value);
      }
    }
    for (const child of [].concat(children || [])) {
      if (child == null || child === false) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  const icon = (paths, size) => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', size || 20);
    svg.setAttribute('height', size || 20);
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.75');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = paths;
    return svg;
  };

  const ICONS = {
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    camera: '<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.8 3.7h4.4a1 1 0 0 1 .83.45l.94 1.4A1 1 0 0 0 16.8 6h1.7A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12.5" r="3.2"/>',
    home: '<path d="M4 10.5 12 4l8 6.5"/><path d="M6 10v9.5h12V10"/>',
    bookmark: '<path d="M6.5 4.5h11a1 1 0 0 1 1 1v14l-6.5-4-6.5 4v-14a1 1 0 0 1 1-1z"/>',
    bell: '<path d="M18 9a6 6 0 1 0-12 0c0 4.5-1.5 6-2 6.5h16c-.5-.5-2-2-2-6.5"/><path d="M10.5 19a1.8 1.8 0 0 0 3 0"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.4"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    down: '<path d="M12 4.5v14"/><path d="m6.5 13 5.5 5.5L17.5 13"/>',
    trend: '<path d="M4 17.5 9.5 12l3.5 3.5L20 8"/><path d="M15.5 8H20v4.5"/>',
    external: '<path d="M14 4.5h5.5V10"/><path d="M19 5 11 13"/><path d="M18 14.5v4a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>',
    trash: '<path d="M4.5 6.5h15M9.5 6.5V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.5"/><path d="M6.5 6.5 7.4 19a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9l.9-12.5"/>',
    back: '<path d="M15 5.5 8.5 12l6.5 6.5"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  };

  function chip(label, kind, iconName) {
    return el('span', { class: 'chip' + (kind ? ' chip-' + kind : '') }, [
      iconName ? icon(ICONS[iconName], 13) : null,
      label,
    ]);
  }

  // =====================================================================
  // Chart — hand-drawn SVG (no chart library can be loaded here).
  // Colour follows the retailer, never its rank, so changing the range
  // never repaints the series.
  // =====================================================================

  const SERIES_VARS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
  const NICE_STEPS = [100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000];

  function niceTicks(min, max, target) {
    const low = Math.max(0, Math.floor(min));
    const high = Math.ceil(max);
    const span = Math.max(high - low, 1);
    const step = NICE_STEPS.find((candidate) => span / candidate <= (target || 4)) || Math.ceil(span / (target || 4));
    const ticks = [];
    for (let value = Math.ceil(low / step) * step; value <= high; value += step) ticks.push(value);
    return { low, high, ticks };
  }

  /**
   * Colour follows the retailer, never its rank — and it is the same colour
   * the retailer wears on its badge in the comparison table, so the legend is
   * learnable and changing the date range repaints nothing.
   */
  function retailerColors(entry) {
    const list = (entry.retailers || DEFAULT_RETAILERS).slice().sort();
    const map = {};
    for (const retailer of list) map[retailer] = retailerColor(retailer);
    return map;
  }

  function drawChart(host, options) {
    const { series, mode, colors, avg, target } = options;
    host.textContent = '';
    if (!series || series.length < 2) {
      host.appendChild(el('p', { class: 'empty', text: 'Not enough history to chart yet.' }));
      return;
    }

    const width = Math.max(host.clientWidth || 320, 260);
    const height = width < 520 ? 220 : 280;
    const padding = { top: 18, right: 12, bottom: 26, left: 52 };
    const plotW = width - padding.left - padding.right;
    const plotH = height - padding.top - padding.bottom;

    const retailers = mode === 'retailer' ? Object.keys(colors) : [];
    const values = [];
    for (const point of series) {
      if (mode === 'retailer') {
        for (const retailer of retailers) {
          if (point.byRetailer[retailer] != null) values.push(point.byRetailer[retailer]);
        }
      } else {
        values.push(point.best);
      }
    }
    const rawMin = Math.min.apply(null, values);
    const rawMax = Math.max.apply(null, values);
    const pad = Math.max((rawMax - rawMin) * 0.12, rawMax * 0.02);
    const scale = niceTicks(rawMin - pad, rawMax + pad, 4);

    const x = (index) => padding.left + (index * plotW) / (series.length - 1);
    const y = (value) => padding.top + ((scale.high - value) / (scale.high - scale.low || 1)) * plotH;

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label',
      mode === 'retailer'
        ? 'Price per retailer over ' + series.length + ' days'
        : 'Best total price over ' + series.length + ' days, from ' + money(series[0].best) + ' to ' + money(series[series.length - 1].best));

    const ns = 'http://www.w3.org/2000/svg';
    const add = (tag, attrs) => {
      const node = document.createElementNS(ns, tag);
      for (const key of Object.keys(attrs)) node.setAttribute(key, attrs[key]);
      svg.appendChild(node);
      return node;
    };

    // Gridlines + y labels — solid hairlines, one shade off the surface.
    for (const tick of scale.ticks) {
      add('line', { x1: padding.left, x2: width - padding.right, y1: y(tick), y2: y(tick), stroke: 'var(--line)', 'stroke-width': 1 });
      const label = add('text', { x: padding.left - 10, y: y(tick) + 4, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 11 });
      label.textContent = moneyShort(tick);
    }

    // Baseline + x labels.
    add('line', { x1: padding.left, x2: width - padding.right, y1: height - padding.bottom, y2: height - padding.bottom, stroke: 'var(--baseline)', 'stroke-width': 1 });
    const tickCount = width < 420 ? 4 : 6;
    const step = Math.max(1, Math.floor((series.length - 1) / (tickCount - 1)));
    for (let index = 0; index < series.length; index += step) {
      const label = add('text', { x: x(index), y: height - 8, 'text-anchor': index === 0 ? 'start' : 'middle', fill: 'var(--muted)', 'font-size': 11 });
      label.textContent = shortDate(series[index].date);
    }

    // Threshold rules — keyed below the plot, never labelled inline.
    if (mode === 'best' && avg != null && avg >= scale.low && avg <= scale.high) {
      add('line', { x1: padding.left, x2: width - padding.right, y1: y(avg), y2: y(avg), stroke: 'var(--muted)', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' });
    }
    if (target != null && target >= scale.low && target <= scale.high) {
      add('line', { x1: padding.left, x2: width - padding.right, y1: y(target), y2: y(target), stroke: 'var(--good)', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' });
    }

    function linePath(getValue) {
      let d = '';
      let pen = false;
      series.forEach((point, index) => {
        const value = getValue(point);
        if (value == null) { pen = false; return; }
        d += (pen ? ' L' : ' M') + x(index).toFixed(1) + ' ' + y(value).toFixed(1);
        pen = true;
      });
      return d.trim();
    }

    if (mode === 'retailer') {
      for (const retailer of retailers) {
        const d = linePath((point) => point.byRetailer[retailer]);
        if (d) add('path', { d, fill: 'none', stroke: colors[retailer], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
      }
    } else {
      add('path', { d: linePath((point) => point.best), fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });

      // Direct-label the low point only — the current price is the hero above.
      let lowIndex = 0;
      series.forEach((point, index) => { if (point.best < series[lowIndex].best) lowIndex = index; });
      const lowPoint = series[lowIndex];
      add('circle', { cx: x(lowIndex), cy: y(lowPoint.best), r: 4, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 });
      const anchorEnd = lowIndex > series.length * 0.7;
      const label = add('text', {
        x: x(lowIndex) + (anchorEnd ? -9 : 0),
        y: y(lowPoint.best) + (anchorEnd ? 4 : -11),
        'text-anchor': anchorEnd ? 'end' : 'middle',
        fill: 'var(--ink)', 'font-size': 11, 'font-weight': 650,
      });
      label.textContent = 'low ' + money(lowPoint.best);
    }

    const crosshair = add('line', { x1: 0, x2: 0, y1: padding.top, y2: height - padding.bottom, stroke: 'var(--baseline)', 'stroke-width': 1, opacity: 0 });
    const markers = document.createElementNS(ns, 'g');
    svg.appendChild(markers);

    host.appendChild(svg);

    const tooltip = el('div', { class: 'tooltip', role: 'status' });
    host.appendChild(tooltip);

    function hide() {
      crosshair.setAttribute('opacity', 0);
      markers.textContent = '';
      tooltip.setAttribute('data-visible', 'false');
    }

    function move(event) {
      const rect = svg.getBoundingClientRect();
      const px = ((event.clientX - rect.left) / rect.width) * width;
      const index = Math.max(0, Math.min(series.length - 1, Math.round(((px - padding.left) / plotW) * (series.length - 1))));
      const point = series[index];

      crosshair.setAttribute('x1', x(index));
      crosshair.setAttribute('x2', x(index));
      crosshair.setAttribute('opacity', 1);

      markers.textContent = '';
      const rows = [];
      if (mode === 'retailer') {
        for (const retailer of retailers) {
          const value = point.byRetailer[retailer];
          if (value == null) continue;
          rows.push({ label: retailer, value, color: colors[retailer] });
        }
      } else {
        rows.push({ label: 'Best price', value: point.best, color: 'var(--s1)' });
      }
      rows.sort((a, b) => a.value - b.value);

      for (const row of rows) {
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', x(index));
        dot.setAttribute('cy', y(row.value));
        dot.setAttribute('r', 4);
        dot.setAttribute('fill', row.color);
        dot.setAttribute('stroke', 'var(--surface)');
        dot.setAttribute('stroke-width', 2);
        markers.appendChild(dot);
      }

      tooltip.textContent = '';
      tooltip.appendChild(el('p', { style: 'font-weight:650;margin-bottom:6px', text: longDate(point.date) }));
      rows.forEach((row, position) => {
        tooltip.appendChild(el('div', { class: 'tt-row' }, [
          el('span', { class: 'row', style: 'gap:6px;color:var(--ink-2)' }, [
            el('span', { class: 'swatch', style: 'background:' + row.color }),
            row.label,
          ]),
          el('span', { class: 'tabular', style: position === 0 ? 'font-weight:650' : 'color:var(--ink-2)', text: money(row.value) }),
        ]));
      });
      tooltip.appendChild(el('p', { class: 'muted', style: 'margin-top:6px;font-size:11px', text: 'Total incl. shipping' }));

      const hostWidth = host.clientWidth;
      const ttWidth = tooltip.offsetWidth || 160;
      const left = Math.max(4, Math.min(hostWidth - ttWidth - 4, (x(index) / width) * hostWidth - ttWidth / 2));
      tooltip.style.left = left + 'px';
      tooltip.style.top = '6px';
      tooltip.setAttribute('data-visible', 'true');
    }

    /*
     * Touch handling: a vertical swipe that starts on the chart must scroll
     * the page, not scrub the series. We only engage the readout once a
     * gesture is clearly horizontal — or on a tap.
     */
    let tracking = false;
    let engaged = false;
    let startX = 0;
    let startY = 0;

    svg.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse') { move(event); return; }
      tracking = true;
      engaged = false;
      startX = event.clientX;
      startY = event.clientY;
    });

    svg.addEventListener('pointermove', (event) => {
      if (event.pointerType === 'mouse') { move(event); return; }
      if (!tracking) return;
      if (!engaged) {
        const dx = Math.abs(event.clientX - startX);
        const dy = Math.abs(event.clientY - startY);
        if (dy > dx && dy > 6) { tracking = false; hide(); return; }
        if (dx < 6) return;
        engaged = true;
      }
      move(event);
    });

    svg.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'mouse') return;
      if (tracking && !engaged) move(event); // a tap reads that point
      tracking = false;
    });

    svg.addEventListener('pointercancel', () => { tracking = false; hide(); });
    svg.addEventListener('pointerleave', (event) => {
      if (event.pointerType === 'mouse') hide();
    });
  }

  /** Native BarcodeDetector where available; otherwise ask for the digits. */
  async function decodeBarcode(file) {
    if (!('BarcodeDetector' in window)) {
      throw new Error("This browser can't read barcode images — type the number under the barcode instead.");
    }
    const url = URL.createObjectURL(file);
    try {
      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('That file could not be opened as an image.'));
        img.src = url;
      });
      const supported = await window.BarcodeDetector.getSupportedFormats();
      const formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'].filter((f) => supported.includes(f));
      const detector = new window.BarcodeDetector(formats.length ? { formats } : undefined);
      const results = await detector.detect(image);
      if (!results.length) {
        throw new Error("Couldn't read a barcode in that image. Try a straight-on, well-lit photo — or type the number in.");
      }
      return results[0].rawValue.replace(/\D/g, '') || results[0].rawValue;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function trackSection(entry, stats, watch) {
    const section = el('section', { class: 'card pad stack-sm', 'aria-labelledby': 'track-heading' });
    const feedback = el('p', { class: 'sm', style: 'color:var(--good-text)' });
    feedback.hidden = true;

    const input = el('input', {
      class: 'input tabular', type: 'text', inputmode: 'decimal',
      'aria-label': 'Target price in dollars',
      value: watch && watch.targetCents != null ? (watch.targetCents / 100).toFixed(2) : '',
      placeholder: stats.min != null ? (stats.min / 100).toFixed(2) : '0.00',
    });

    function saveWatch(event) {
      event.preventDefault();
      const targetCents = input.value.trim() === '' ? null : parseMoney(input.value);
      if (input.value.trim() !== '' && (!targetCents || targetCents <= 0)) {
        feedback.textContent = 'Enter a target price like 249.99, or leave it blank.';
        feedback.style.color = 'var(--critical)';
        feedback.hidden = false;
        return;
      }
      const existing = state.watches[entry.slug];
      state.watches[entry.slug] = {
        targetCents,
        createdAt: existing ? existing.createdAt : Date.now(),
        lastAlertCents: null,
        lastAlertDay: null,
      };
      rememberEntry(entry);
      save();
      const fired = evaluateWatches();
      render();
      window.setTimeout(() => {
        const toast = document.getElementById('track-feedback');
        if (toast) {
          toast.textContent = fired ? 'Tracking. That already qualifies — check Alerts.' : "Tracking. We'll flag it when it drops.";
          toast.hidden = false;
        }
      }, 0);
    }

    section.appendChild(el('div', { class: 'row-between' }, [
      el('h2', { id: 'track-heading', text: watch ? 'Tracking this product' : 'Track this price' }),
      watch ? el('button', {
        class: 'btn btn-ghost btn-sm', type: 'button',
        onclick: () => { delete state.watches[entry.slug]; save(); render(); },
      }, [icon(ICONS.trash, 15), 'Stop tracking']) : null,
    ]));

    section.appendChild(el('form', { class: 'stack-sm', onsubmit: saveWatch }, [
      el('label', { class: 'sm ink-2', style: 'font-weight:500', text: 'Alert me under' }),
      el('div', { class: 'row' }, [
        el('div', { class: 'grow' }, [input]),
        el('button', { class: 'btn btn-primary', type: 'submit', text: watch ? 'Update' : 'Track' }),
      ]),
      el('p', { class: 'xs muted', text: stats.min != null ? 'Lowest seen in this window: ' + money(stats.min) : '' }),
      el('p', { id: 'track-feedback', class: 'sm', style: 'color:var(--good-text)', hidden: true }),
      feedback,
    ]));

    section.appendChild(el('p', { class: 'xs muted', text: 'In the full app this saves to your account and a scheduled job re-checks prices; here it is saved in this browser and re-checked when you open the app.' }));

    return section;
  }

  // --- watchlist view ------------------------------------------------

  function watchlistView() {
    const wrap = el('div', { class: 'stack' });
    wrap.appendChild(el('h1', { text: 'Watchlist' }));

    const slugs = Object.keys(state.watches);
    if (!slugs.length) {
      wrap.appendChild(el('div', { class: 'card pad stack-sm', style: 'text-align:center' }, [
        el('p', { class: 'sm ink-2', text: 'Nothing tracked yet. Open a product and set a target price to watch it.' }),
        el('button', { class: 'btn btn-primary', type: 'button', text: 'Find a product', style: 'align-self:center', onclick: () => go({ name: 'search' }) }),
      ]));
      return wrap;
    }

    const day = today();
    const list = el('div', { class: 'stack-sm' });

    for (const slug of slugs) {
      const entry = entryFor(slug);
      if (!entry) continue;
      const watch = state.watches[slug];
      const offers = offersFor(entry, day).filter((offer) => offer.inStock).sort((a, b) => a.totalCents - b.totalCents);
      const best = offers[0];
      const stats = statsFor(entry, 90, day);
      const targetMet = watch.targetCents != null && best && best.totalCents <= watch.targetCents;

      list.appendChild(el('div', { class: 'card pad' }, [
        el('div', { class: 'row', style: 'align-items:flex-start;gap:12px' }, [
          el('button', { type: 'button', style: 'background:none;border:0;padding:0;cursor:pointer', 'aria-label': 'Open ' + entry.title, onclick: () => openProduct(slug) }, [productImage(entry, '60px')]),
          el('div', { class: 'grow' }, [
            el('button', {
              class: 'result-title', type: 'button',
              style: 'background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:inherit',
              text: entry.title, onclick: () => openProduct(slug),
            }),
            el('p', { class: 'xs muted', style: 'margin-top:2px', text: best ? 'Cheapest at ' + best.retailer : 'No offers in stock' }),
            el('div', { class: 'row wrap', style: 'gap:6px;margin-top:6px' }, [
              targetMet ? chip('Target met', 'good', 'check') : null,
              stats.hasRecentDrop ? chip(stats.recentDropPercent + '% this week', 'good', 'down') : null,
              watch.targetCents != null && !targetMet ? chip('Target ' + money(watch.targetCents)) : null,
            ]),
          ]),
          el('div', { style: 'text-align:right;flex-shrink:0' }, [
            el('p', { class: 'price-lg tabular', text: money(best ? best.totalCents : null) }),
            stats.avg != null ? el('p', { class: 'xs muted tabular', text: 'avg ' + money(stats.avg) }) : null,
          ]),
        ]),
        el('div', { class: 'row', style: 'justify-content:flex-end;margin-top:8px' }, [
          el('button', {
            class: 'btn btn-ghost btn-sm',
            type: 'button',
            'aria-label': 'Stop tracking ' + entry.title,
            onclick: () => { delete state.watches[slug]; save(); render(); },
          }, [icon(ICONS.trash, 14), 'Remove']),
        ]),
      ]));
    }

    wrap.appendChild(list);

    // Demo-only control: the real app runs a cron job instead.
    wrap.appendChild(el('div', { class: 'banner-demo' }, [
      el('span', { class: 'grow' }, [
        el('strong', { text: 'Demo control · ' }),
        'Prices here follow the real calendar. Jump the clock forward to watch history extend and alerts fire — the full app does this from a scheduled job.',
      ]),
      el('div', { class: 'row', style: 'gap:6px' }, [
        el('button', {
          class: 'btn btn-secondary btn-sm', type: 'button', text: '+1 day',
          onclick: () => { state.dayOffset += 1; save(); evaluateWatches(); render(); },
        }),
        el('button', {
          class: 'btn btn-secondary btn-sm', type: 'button', text: '+1 week',
          onclick: () => { state.dayOffset += 7; save(); evaluateWatches(); render(); },
        }),
        state.dayOffset ? el('button', {
          class: 'btn btn-ghost btn-sm', type: 'button', text: 'Reset (+' + state.dayOffset + 'd)',
          onclick: () => { state.dayOffset = 0; save(); render(); },
        }) : null,
      ]),
    ]));

    return wrap;
  }

  // --- alerts view ---------------------------------------------------

  const TYPE_LABELS = {
    target_hit: 'Target reached',
    all_time_low: 'All-time low',
    below_average: 'Below average',
  };

  function alertsView() {
    const wrap = el('div', { class: 'stack' });
    const unread = unreadCount();

    wrap.appendChild(el('div', { class: 'row-between' }, [
      el('h1', {}, ['Alerts', unread ? el('span', { style: 'color:var(--brand);font-size:14px;font-weight:600;margin-left:8px', text: unread + ' new' }) : null]),
      unread ? el('button', {
        class: 'btn btn-ghost btn-sm', type: 'button', text: 'Mark all read',
        onclick: () => { state.notifications.forEach((n) => { n.read = true; }); save(); render(); },
      }) : null,
    ]));

    if (!state.notifications.length) {
      wrap.appendChild(el('div', { class: 'card pad stack-sm', style: 'text-align:center' }, [
        el('span', { style: 'color:var(--muted)' }, [icon(ICONS.bell, 30)]),
        el('p', { class: 'sm ink-2', text: "No alerts yet. Track a product with a target price, then jump the demo clock forward on the watchlist to see one fire." }),
        el('button', { class: 'btn btn-secondary', type: 'button', text: 'Go to watchlist', style: 'align-self:center', onclick: () => go({ name: 'watchlist' }) }),
      ]));
      return wrap;
    }

    const list = el('div', { class: 'stack-sm' });
    for (const notification of state.notifications) {
      const entry = entryFor(notification.slug);
      list.appendChild(el('div', {
        class: 'card pad stack-sm',
        style: notification.read ? '' : 'border-color:color-mix(in srgb, var(--brand) 45%, var(--line))',
      }, [
        el('div', { class: 'row-between', style: 'align-items:flex-start' }, [
          el('div', { class: 'grow' }, [
            el('div', { class: 'row wrap', style: 'gap:8px' }, [
              el('h3', { text: notification.title }),
              chip(TYPE_LABELS[notification.type] || notification.type),
            ]),
            el('p', { class: 'sm ink-2', style: 'margin-top:4px', text: notification.body }),
            el('p', { class: 'xs muted', style: 'margin-top:4px', text: relativeTime(notification.at) }),
          ]),
          el('p', { class: 'tabular', style: 'font-weight:700;font-size:16px', text: money(notification.priceCents) }),
        ]),
        el('div', { class: 'row wrap', style: 'gap:8px' }, [
          entry ? el('button', { class: 'btn btn-secondary btn-sm', type: 'button', text: 'View product', onclick: () => openProduct(notification.slug) }) : null,
          el('a', { class: 'btn btn-secondary btn-sm', href: notification.url, target: '_blank', rel: 'noopener noreferrer nofollow' }, ['Buy at ' + notification.retailer, icon(ICONS.external, 13)]),
          !notification.read ? el('button', {
            class: 'btn btn-ghost btn-sm', type: 'button', text: 'Mark read',
            onclick: () => { notification.read = true; save(); render(); },
          }) : null,
        ]),
      ]));
    }
    wrap.appendChild(list);
    return wrap;
  }

  // --- about view ----------------------------------------------------

  function aboutView() {
    const wrap = el('div', { class: 'stack' });
    wrap.appendChild(el('h1', { text: 'About this demo' }));

    wrap.appendChild(el('div', { class: 'card pad stack-sm' }, [
      el('h2', { text: 'What you are looking at' }),
      el('p', { class: 'sm ink-2', text: 'PriceScout finds the cheapest place to buy a product, charts what it has cost over time, and tells you when it drops to your price. This page is a self-contained demo of that interface: the pricing engine that the full app runs on the server is running here in your browser instead.' }),
      el('p', { class: 'sm ink-2', text: 'Every price is generated from a deterministic model — the same product always produces the same history — so the charts, comparisons and alerts all behave like the real thing without touching a retailer.' }),
    ]));

    wrap.appendChild(el('div', { class: 'card pad stack-sm' }, [
      el('h2', { text: 'What the full app adds' }),
      el('ul', { class: 'sm ink-2', style: 'margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px' }, [
        el('li', { html: '<strong>Live prices.</strong> A <code>PriceProvider</code> interface with implementations for Google Shopping (SerpApi) and Amazon (Rainforest). Swapping sources is one environment variable; no scraping is used anywhere.' }),
        el('li', { html: '<strong>Real price history.</strong> Every observation is appended to a database, so history accrues from the first time anyone searches a product.' }),
        el('li', { html: '<strong>A scheduled job.</strong> Cron re-quotes tracked products in bounded batches and evaluates alerts — no need to open the app.' }),
        el('li', { html: '<strong>An account.</strong> Your watchlist follows you across devices, with optional email alerts.' }),
        el('li', { html: '<strong>An installable PWA</strong> with an offline shell.' }),
      ]),
      el('p', { class: 'sm ink-2', text: 'Here, the watchlist and alerts live in this browser only, and the clock control on the watchlist stands in for the scheduled job.' }),
    ]));

    wrap.appendChild(el('div', { class: 'card pad stack-sm' }, [
      el('h2', { text: 'Reset' }),
      el('p', { class: 'sm ink-2', text: 'Clears the watchlist, alerts, recents and the demo clock from this browser.' }),
      el('button', {
        class: 'btn btn-secondary', type: 'button', text: 'Clear demo data', style: 'align-self:flex-start',
        onclick: () => {
          state = Object.assign({}, defaults, { watches: {}, notifications: [], recentSearches: [], recentlyViewed: [], customEntries: {}, dayOffset: 0 });
          save();
          go({ name: 'search' });
        },
      }),
    ]));

    wrap.appendChild(demoBanner());
    return wrap;
  }

  // =====================================================================
  // Render
  // =====================================================================

  function render() {
    renderNav();
    view.textContent = '';
    let content;
    if (route.name === 'product') content = productView();
    else if (route.name === 'watchlist') content = watchlistView();
    else if (route.name === 'alerts') content = alertsView();
    else if (route.name === 'about') content = aboutView();
    else content = searchView();
    view.appendChild(content);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (route.name !== 'product') return;
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(render, 150);
  });

  evaluateWatches();
  render();
})();
</script>
